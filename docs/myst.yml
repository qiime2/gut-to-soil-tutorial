# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: gut-to-soil-tutorial
  title: The gut-to-soil axis microbiome analysis tutorial
  github: https://github.com/qiime2/gut-to-soil-tutorial/

  references:
    rachis-glossary-target: https://news.rachis.org/en/latest/
    rachis-library-target: https://library.qiime2.org

  plugins:
    - type: executable
      path: q2doc-plug.py

  toc:
    - file: intro.md
    - file: gut-to-soil-16S-tutorial.md
    - file: why.md

  downloads:
    - file: _static/environment.yml
      title: Conda environment file

site:
  template: https://github.com/ebolyen/myst-book-theme-poc.git
  options:
      folders: true
      favicon: _static/favicon.ico
      logo: _static/q2docs.png
      pretty_urls: false
