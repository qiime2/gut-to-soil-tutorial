name: build-docs

# builds the book on a GH runner with the same steps as .readthedocs.yaml,
# saves the resulting HTML as an artifact & uploads it to RTD:
#   PR                     -> PR preview (/en/<PR number>/)
#   push to main           -> latest
#   push to release branch -> that version (e.g. 2026.10), plus stable if it is
#                             the newest release branch
#   manual run             -> build only, no upload
# https://docs.readthedocs.com/platform/stable/guides/build/direct-upload.html

on:
  pull_request:
  push:
    branches:
      - main
      - '[0-9][0-9][0-9][0-9].*'
  workflow_dispatch:
    inputs:
      canonical-url:
        description: 'URL the docs will be served from (optional)'
        required: false
        default: ''

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  RTD_SLUG: gut-to-soil-tutorial

jobs:
  # decides which RTD version(s) this run builds, and the URL each is served from
  # (the URL is baked into the build, so each version needs its own build)
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CANONICAL_URL: ${{ inputs.canonical-url }}
        run: |
          site="https://${RTD_SLUG}.readthedocs.io/en"
          entry() {  # label, version-name ('' = inferred by the upload action), url, upload
            jq -nc --arg l "$1" --arg v "$2" --arg u "$3" --argjson up "$4" \
              '{label: $l, version: $v, url: $u, upload: $up}'
          }

          entries=()
          case "$EVENT" in
            pull_request)
              # PRs from forks don't get secrets, so only same-repo PRs upload
              upload=false
              [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && upload=true
              entries+=("$(entry "pr-${PR_NUMBER}" "" \
                "https://${RTD_SLUG}--${PR_NUMBER}.org.readthedocs.build/en/${PR_NUMBER}/" "$upload")")
              ;;
            push)
              if [ "$REF_NAME" = main ]; then
                entries+=("$(entry latest latest "${site}/latest/" true)")
              elif [[ "$REF_NAME" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
                entries+=("$(entry "$REF_NAME" "$REF_NAME" "${site}/${REF_NAME}/" true)")
                # only the newest release branch updates stable, so a fix pushed
                # to an older release doesn't overwrite it
                newest=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}" \
                  | sed -nE 's#.*refs/heads/([0-9]{4}\.[0-9]+)$#\1#p' | sort -V | tail -n 1)
                echo "newest release branch: ${newest}"
                if [ "$REF_NAME" = "$newest" ]; then
                  entries+=("$(entry stable stable "${site}/stable/" true)")
                fi
              else
                echo "::error::push to unrecognized branch ${REF_NAME}"
                exit 1
              fi
              ;;
            workflow_dispatch)
              entries+=("$(entry manual "" "$CANONICAL_URL" false)")
              ;;
          esac

          matrix=$(printf '%s\n' "${entries[@]}" | jq -sc .)
          echo "$matrix" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    defaults:
      run:
        # login shell so setup-miniconda's conda/mamba are on PATH
        shell: bash -el {0}
    env:
      CANONICAL_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4

      - name: set up miniforge
        uses: qiime2-cutlery/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ''

      - name: runner resources
        run: |
          nproc
          free -h
          df -h .

      - name: create environment
        run: mamba env create -p "$PWD/.env" --file environment-files/readthedocs.yml

      - name: set RTD-style URL variables
        if: env.CANONICAL_URL != ''
        run: |
          base_url=$(echo "$CANONICAL_URL" | sed -E -e 's#^https?://[^/]+##' -e 's#/$##')
          echo "READTHEDOCS_CANONICAL_URL=$CANONICAL_URL" >> "$GITHUB_ENV"
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: refresh q2doc cache
        run: PATH=$(pwd)/.env/bin/:$PATH q2doc refresh-cache

      - name: build html
        run: PATH=$(pwd)/.env/bin/:$PATH make html

      - name: upload html
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ matrix.label }}
          path: docs/_build/html/
          if-no-files-found: error

      - name: upload to Read the Docs
        if: matrix.upload
        uses: qiime2-cutlery/upload-action@main
        with:
          token: ${{ secrets.GTS_PAT }}
          project-slug: ${{ env.RTD_SLUG }}
          html: docs/_build/html
          version-name: ${{ matrix.version }}
